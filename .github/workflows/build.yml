name: Build 1.21.11

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.1

      - name: Generate project files
        run: |
          cat > settings.gradle <<'TS_EOF_0'
          pluginManagement {
              repositories {
                  maven {
                      name = 'Fabric'
                      url = 'https://maven.fabricmc.net/'
                  }
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          rootProject.name = 'transparent-skin'
          TS_EOF_0
          cat > build.gradle <<'TS_EOF_1'
          plugins {
              id 'fabric-loom' version '1.14-SNAPSHOT'
          }

          version = '1.0.7'
          group = 'com.vizkovico'

          base {
              archivesName = 'essentials-client'
          }

          repositories {
              mavenCentral()
          }

          dependencies {
              minecraft "com.mojang:minecraft:1.21.11"
              mappings "net.fabricmc:yarn:1.21.11+build.4:v2"
              modImplementation "net.fabricmc:fabric-loader:0.18.4"
              modImplementation "net.fabricmc.fabric-api:fabric-api:0.141.3+1.21.11"
              include "javazoom:jlayer:1.0.1"
              implementation "javazoom:jlayer:1.0.1"
          }

          processResources {
              inputs.property "version", project.version

              filesMatching("fabric.mod.json") {
                  expand "version": project.version
              }
          }

          tasks.withType(JavaCompile).configureEach {
              it.options.release = 21
          }

          java {
              sourceCompatibility = JavaVersion.VERSION_21
              targetCompatibility = JavaVersion.VERSION_21
          }
          TS_EOF_1
          mkdir -p src/main/resources
          cat > src/main/resources/fabric.mod.json <<'TS_EOF_2'
          {
            "schemaVersion": 1,
            "id": "transparentskin",
            "version": "${version}",
            "name": "Essentials Client",
            "description": "Client-side tools: skin transparan (opacity dan hide bagian tubuh), cosmetic dari file Blockbench, wardrobe skin, preview karakter, akun offline, inventory sorter, dan toggle sprint. Buka menu dengan /ts. Lihat changelog di release.",
            "authors": [
              "Anonymous"
            ],
            "license": "MIT",
            "environment": "client",
            "entrypoints": {
              "client": [
                "com.vizkovico.transparentskin.TransparentSkinMod"
              ]
            },
            "mixins": [
              "transparentskin.mixins.json"
            ],
            "depends": {
              "fabricloader": ">=0.18.1",
              "minecraft": "1.21.11",
              "java": ">=21",
              "fabric-api": "*"
            }
          }
          TS_EOF_2
          mkdir -p src/main/resources
          cat > src/main/resources/transparentskin.mixins.json <<'TS_EOF_3'
          {
            "required": true,
            "minVersion": "0.8",
            "package": "com.vizkovico.transparentskin.mixin",
            "compatibilityLevel": "JAVA_21",
            "mixins": [],
            "client": [
              "ModelPartMixin",
              "PlayerEntityModelMixin",
              "ScreenInvoker",
              "AbstractClientPlayerEntityMixin"
            ],
            "injectors": {
              "defaultRequire": 0
            }
          }
          TS_EOF_3
          mkdir -p src/main/java/com/vizkovico/transparentskin
          cat > src/main/java/com/vizkovico/transparentskin/TransparentSkinMod.java <<'TS_EOF_4'
          package com.vizkovico.transparentskin;

          import com.google.gson.Gson;
          import com.google.gson.GsonBuilder;
          import com.google.gson.JsonArray;
          import com.google.gson.JsonElement;
          import com.google.gson.JsonObject;
          import com.google.gson.JsonParser;
          import com.mojang.authlib.GameProfile;
          import net.fabricmc.api.ClientModInitializer;
          import net.fabricmc.fabric.api.client.command.v2.ClientCommandManager;
          import net.fabricmc.fabric.api.client.command.v2.ClientCommandRegistrationCallback;
          import net.fabricmc.fabric.api.client.event.lifecycle.v1.ClientLifecycleEvents;
          import net.fabricmc.fabric.api.client.event.lifecycle.v1.ClientTickEvents;
          import net.fabricmc.fabric.api.client.rendering.v1.LivingEntityFeatureRendererRegistrationCallback;
          import net.fabricmc.fabric.api.client.screen.v1.ScreenEvents;
          import net.fabricmc.loader.api.FabricLoader;
          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.gui.DrawContext;
          import net.minecraft.client.render.RenderTickCounter;
          import net.minecraft.client.network.ClientPlayerEntity;
          import net.minecraft.registry.Registries;
          import net.minecraft.screen.slot.SlotActionType;
          import java.util.Comparator;
          import net.minecraft.client.option.KeyBinding;
          import net.minecraft.client.util.InputUtil;
          import org.lwjgl.glfw.GLFW;
          import net.fabricmc.fabric.api.client.keybinding.v1.KeyBindingHelper;
          import net.fabricmc.fabric.api.client.rendering.v1.HudRenderCallback;
          import java.io.ByteArrayOutputStream;
          import java.nio.ByteBuffer;
          import java.nio.ByteOrder;
          import java.util.concurrent.CompletableFuture;
          import org.lwjgl.openal.AL10;
          import javazoom.jl.decoder.Bitstream;
          import javazoom.jl.decoder.Decoder;
          import javazoom.jl.decoder.Header;
          import javazoom.jl.decoder.SampleBuffer;
          import net.minecraft.item.ItemStack;
          import java.util.Random;
          import net.minecraft.entity.Entity;
          import java.net.URI;
          import java.net.URLEncoder;
          import java.net.http.HttpClient;
          import java.net.http.HttpRequest;
          import java.net.http.HttpResponse;
          import java.nio.file.StandardCopyOption;
          import java.time.Duration;
          import net.fabricmc.fabric.api.event.player.AttackEntityCallback;
          import net.minecraft.entity.player.PlayerEntity;
          import net.minecraft.util.ActionResult;
          import net.minecraft.text.MutableText;
          import net.minecraft.util.Formatting;
          import net.minecraft.entity.LivingEntity;
          import net.minecraft.client.gl.RenderPipelines;
          import java.util.LinkedHashMap;
          import net.minecraft.client.font.TextRenderer;
          import net.minecraft.client.gui.PlayerSkinDrawer;
          import net.minecraft.client.gui.screen.GameMenuScreen;
          import net.minecraft.client.gui.screen.TitleScreen;
          import net.minecraft.client.gui.screen.Screen;
          import net.minecraft.client.gui.screen.ingame.InventoryScreen;
          import net.minecraft.client.gui.widget.ButtonWidget;
          import net.minecraft.client.gui.widget.ClickableWidget;
          import net.minecraft.client.gui.widget.PlayerSkinWidget;
          import net.minecraft.client.gui.widget.TextFieldWidget;
          import net.minecraft.client.gui.widget.SliderWidget;
          import net.minecraft.client.model.Dilation;
