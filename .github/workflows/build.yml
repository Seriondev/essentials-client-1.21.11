              /** helper kartu kaca bersama untuk semua layar */
              public static final class GlassKit {
                  public static final int BLUE = 0xFF3B82F6;
                  public static final int OFF = 0xFF3A3F47;
                  public static final int CARD = 0xD0101418;

                  private GlassKit() {
                  }

                  public static void card(DrawContext c, TextRenderer tr, int x, int y, int w, int h, String title, int accent) {
                      ConfigScreen.rr(c, x, y, w, h, 10, CARD);
                      c.fill(x + 10, y + 1, x + w - 10, y + 2, 0x55FFFFFF);
                      ConfigScreen.rr(c, x + 10, y + 10, 6, 6, 3, accent);
                      c.drawTextWithShadow(tr, Text.literal(title), x + 22, y + 9, 0xFFFFFFFF);
                      c.fill(x + 10, y + 26, x + w - 10, y + 27, 0x22FFFFFF);
                  }

                  public static void row(DrawContext c, TextRenderer tr, int x, int y, int w, int h, String label, boolean hover) {
                      if (hover) {
                          ConfigScreen.rr(c, x, y, w, h, 5, 0x26FFFFFF);
                      }
                      c.drawTextWithShadow(tr, Text.literal(label), x + 6, y + (h - 8) / 2, 0xFFE6E8EB);
                  }

                  public static void toggle(DrawContext c, TextRenderer tr, int mx, int my, int x, int y, int w, int h, String label, boolean on) {
                      row(c, tr, x, y, w, h, label, hov(mx, my, x, y, w, h));
                      int pw = 24;
                      int ph = 11;
                      int px = x + w - pw - 6;
                      int py = y + (h - ph) / 2;
                      ConfigScreen.rr(c, px, py, pw, ph, 5, on ? BLUE : OFF);
                      int kx = on ? px + pw - ph + 1 : px + 1;
                      ConfigScreen.rr(c, kx, py + 1, ph - 2, ph - 2, 4, 0xFFFFFFFF);
                  }

                  public static void action(DrawContext c, TextRenderer tr, int mx, int my, int x, int y, int w, int h, String label, String value) {
                      row(c, tr, x, y, w, h, label, hov(mx, my, x, y, w, h));
                      int right = x + w - 6;
                      if (value != null && !value.isEmpty()) {
                          int vw = tr.getWidth(value);
                          c.drawTextWithShadow(tr, Text.literal(value), right - 12 - vw, y + (h - 8) / 2, 0xFFBFC5CE);
                      }
                      c.drawTextWithShadow(tr, Text.literal(">"), right - 6, y + (h - 8) / 2, 0xFF8FB8FF);
                  }

                  public static void box(DrawContext c, int x1, int y1, int x2, int y2, int col) {
                      int w = x2 - x1;
                      int h = y2 - y1;
                      if (w <= 0 || h <= 0) {
                          return;
                      }
                      int r = Math.min(4, Math.min(w, h) / 2);
                      ConfigScreen.rr(c, x1, y1, w, h, r, col);
                  }

                  public static boolean hov(int mx, int my, int x, int y, int w, int h) {
                      return mx >= x && mx < x + w && my >= y && my < y + h;
                  }
              }

              /** slider bergaya kaca: tetap slider (bisa digeser), tampilan digambar ulang */
              private static final class GlassSlider extends SliderWidget {
                  private final String label;
                  private final int min;
                  private final int max;
                  private final IntConsumer setter;

                  GlassSlider(int x, int y, int w, int h, String label, int min, int max, int cur, IntConsumer setter) {
                      super(x, y, w, h, Text.empty(), (cur - min) / (double) (max - min));
                      this.label = label;
                      this.min = min;
                      this.max = max;
                      this.setter = setter;
                  }

                  private int current() {
                      return this.min + (int) Math.round(this.value * (this.max - this.min));
                  }

                  @Override
                  protected void updateMessage() {
                      this.setMessage(Text.empty());
                  }

                  @Override
                  protected void applyValue() {
                      if (this.setter != null) {
                          this.setter.accept(current());
                      }
                  }

                  @Override
                  public void renderWidget(DrawContext c, int mouseX, int mouseY, float delta) {
                      int x = this.getX();
                      int y = this.getY();
                      int w = this.getWidth();
                      int h = this.getHeight();
                      boolean hover = mouseX >= x && mouseX < x + w && mouseY >= y && mouseY < y + h;
                      if (hover) {
                          ConfigScreen.rr(c, x, y, w, h, 5, 0x26FFFFFF);
                      }
                      String val = String.valueOf(current());
                      c.drawTextWithShadow(MinecraftClient.getInstance().textRenderer,
                              Text.literal(label), x + 6, y + (h - 8) / 2, 0xFFE6E8EB);
                      int vw = MinecraftClient.getInstance().textRenderer.getWidth(val);
                      c.drawTextWithShadow(MinecraftClient.getInstance().textRenderer,
                              Text.literal(val), x + w - 8 - vw, y + (h - 8) / 2, 0xFFBFC5CE);
                      int tx = x + 6;
                      int tw = w - 12;
                      int ty = y + h - 4;
                      ConfigScreen.rr(c, tx, ty, tw, 3, 1, OFF_TRACK);
                      int fill = (int) Math.round(tw * this.value);
                      if (fill > 0) {
                          ConfigScreen.rr(c, tx, ty, Math.max(3, fill), 3, 1, BLUE_TRACK);
                      }
                      int kx = tx + fill - 4;
                      ConfigScreen.rr(c, kx, ty - 3, 8, 8, 4, 0xFFFFFFFF);
                  }

                  private static final int OFF_TRACK = 0x33FFFFFF;
                  private static final int BLUE_TRACK = 0xFF3B82F6;
              }

              public static final class ConfigScreen extends Screen {
                  private static final int BLUE = 0xFF3B82F6;
                  private static final int OFF = 0xFF3A3F47;
                  private static final int CARD = 0xD0101418;
                  private static final String[] BASE_NAMES = {"Kepala", "Badan", "Tangan kanan", "Tangan kiri", "Kaki kanan", "Kaki kiri"};
                  private static final String[] OUTER_NAMES = {"Hat", "Jacket", "Lengan kanan", "Lengan kiri", "Celana kanan", "Celana kiri"};

                  private final Screen parent;
                  private int cosPage = 0;
                  private int cardsY;
                  private int cardsH;
                  private int cw;
                  private int gap = 10;
                  private int x0;

                  public ConfigScreen(Screen parent) {
                      super(Text.literal("Setting Mod"));
                      this.parent = parent;
                  }

                  public ConfigScreen(Screen parent, int startPage) {
                      this(parent);
                  }

                  private int cardX(int i) {
                      return x0 + i * (cw + gap);
                  }

                  private void button(int x, int y, int w, int h, Runnable r) {
                      ButtonWidget b = ButtonWidget.builder(Text.empty(), btn -> r.run()).dimensions(x, y, w, h).build();
                      b.setAlpha(0f);
                      this.addDrawableChild(b);
                  }

                  private static int clamp(int v, int lo, int hi) {
                      return Math.max(lo, Math.min(hi, v));
                  }

                  @Override
                  protected void init() {
                      cw = Math.min(200, (this.width - 40 - gap * 3) / 4);
                      x0 = (this.width - (cw * 4 + gap * 3)) / 2;
                      cardsH = Math.min(this.height - 70, 330);
                      cardsY = Math.max(30, (this.height - cardsH) / 2 - 4);
                      Config c = Config.get();

                      // Kartu 0: Umum
                      int cx = cardX(0);
                      int y = cardsY + 32;
                      button(cx, y, cw, 20, () -> {
                          c.enabled = !c.enabled;
                          Config.save();
                      });
                      button(cx, y + 22, cw, 20, () -> {
                          c.everyone = !c.everyone;
                          Config.save();
                      });
                      this.addDrawableChild(new GlassSlider(cx, y + 44, cw, 20, "Opacity base", 0, 100, c.baseOpacity,
                              v -> c.baseOpacity = v));
                      this.addDrawableChild(new GlassSlider(cx, y + 66, cw, 20, "Opacity outer", 0, 100, c.outerOpacity,
                              v -> c.outerOpacity = v));

                      // Kartu 1: Tubuh (12 bagian)
                      cx = cardX(1);
                      y = cardsY + 32;
                      for (int i = 0; i < 12; i++) {
                          final int idx = i;
                          int ry = y + i * 18;
                          button(cx, ry, cw, 17, () -> {
                              if (idx < 6) {
                                  c.hideBase[idx] = !c.hideBase[idx];
                              } else {
                                  c.hideOuter[idx - 6] = !c.hideOuter[idx - 6];
                              }
                              Config.save();
                          });
                      }

                      // Kartu 2: Cosmetic
                      cx = cardX(2);
                      y = cardsY + 32;
                      button(cx, y, cw, 20, () -> {
                          c.cosmeticHideOriginal = !c.cosmeticHideOriginal;
                          Cosmetics.recompute();
                          Config.save();
                      });
                      List<Cosmetics.Loaded> all = Cosmetics.ALL;
                      int per = 8;
                      int pages = Math.max(1, (all.size() + per - 1) / per);
                      cosPage = clamp(cosPage, 0, pages - 1);
                      for (int i = 0; i < per; i++) {
                          int idx = cosPage * per + i;
                          if (idx >= all.size()) {
                              break;
                          }
                          final Cosmetics.Loaded l = all.get(idx);
                          button(cx, y + 22 + i * 22, cw, 20, () -> Cosmetics.toggle(l));
                      }
                      int navY = y + 22 + per * 22;
                      button(cx, navY, cw / 2 - 2, 20, () -> {
                          if (cosPage > 0) {
                              cosPage--;
                              this.clearAndInit();
                          }
                      });
                      button(cx + cw / 2 + 2, navY, cw / 2 - 2, 20, () -> {
                          if (cosPage < pages - 1) {
                              cosPage++;
                              this.clearAndInit();
                          }
                      });
                      button(cx, navY + 22, cw, 20, () -> {
                          Cosmetics.reload();
                          cosPage = 0;
                          this.clearAndInit();
                      });

                      // Kartu 3: Preview & fitur
                      cx = cardX(3);
                      y = cardsY + 32;
                      this.addDrawableChild(new GlassSlider(cx, y, cw, 20, "Posisi X", 0, 100, c.previewX,
                              v -> c.previewX = v));
                      this.addDrawableChild(new GlassSlider(cx, y + 22, cw, 20, "Posisi Y", 0, 100, c.previewY,
                              v -> c.previewY = v));
                      this.addDrawableChild(new GlassSlider(cx, y + 44, cw, 20, "Ukuran", 50, 150, c.previewSize,
                              v -> c.previewSize = v));
                      button(cx, y + 66, cw, 20, () -> this.client.setScreen(new KillStreakScreen(this)));
                      button(cx, y + 88, cw, 20, () -> this.client.setScreen(new HitSoundScreen(this)));
                      button(cx, y + 110, cw, 20, () -> this.client.setScreen(new MusicScreen(this)));
                      button(cx, y + 132, cw, 20, () -> this.client.setScreen(new ScreenshotScreen(this)));

                      // Footer
                      int fy = Math.min(this.height - 22, cardsY + cardsH + 10);
                      button(this.width / 2 - 60, fy, 120, 20, this::close);
                  }

                  // ---- gaya kaca: latar gelap semi-transparan dengan sudut membulat ----
                  private static void rr(DrawContext c, int x, int y, int w, int h, int r, int col) {
                      if (w <= 0 || h <= 0) {
                          return;
                      }
                      r = Math.min(r, Math.min(w, h) / 2);
                      if (r <= 0) {
                          c.fill(x, y, x + w, y + h, col);
                          return;
                      }
                      c.fill(x, y + r, x + w, y + h - r, col);
                      for (int i = 0; i < r; i++) {
                          double d = r - i - 0.5;
                          int inset = r - (int) Math.round(Math.sqrt(Math.max(0, r * r - d * d)));
                          c.fill(x + inset, y + i, x + w - inset, y + i + 1, col);
                          c.fill(x + inset, y + h - 1 - i, x + w - inset, y + h - i, col);
                      }
                  }

                  private static boolean hov(int mx, int my, int x, int y, int w, int h) {
                      return mx >= x && mx < x + w && my >= y && my < y + h;
                  }

                  private void card(DrawContext c, int x, String title, int accent) {
                      rr(c, x, cardsY, cw, cardsH, 10, CARD);
                      c.fill(x + 10, cardsY + 1, x + cw - 10, cardsY + 2, 0x55FFFFFF);
                      rr(c, x + 10, cardsY + 10, 6, 6, 3, accent);
                      c.drawTextWithShadow(this.textRenderer, Text.literal(title), x + 22, cardsY + 9, 0xFFFFFFFF);
                      c.fill(x + 10, cardsY + 26, x + cw - 10, cardsY + 27, 0x22FFFFFF);
                  }

                  private void row(DrawContext c, int x, int y, int w, int h, String label, boolean hover) {
                      if (hover) {
                          rr(c, x, y, w, h, 5, 0x26FFFFFF);
                      }
                      c.drawTextWithShadow(this.textRenderer, Text.literal(label), x + 6, y + (h - 8) / 2, 0xFFE6E8EB);
                  }

                  private void toggleRow(DrawContext c, int mx, int my, int x, int y, int w, int h, String label, boolean on) {
                      row(c, x, y, w, h, label, hov(mx, my, x, y, w, h));
                      int pw = 24;
                      int ph = 11;
                      int px = x + w - pw - 6;
                      int py = y + (h - ph) / 2;
                      rr(c, px, py, pw, ph, 5, on ? BLUE : OFF);
                      int kx = on ? px + pw - ph + 1 : px + 1;
                      rr(c, kx, py + 1, ph - 2, ph - 2, 4, 0xFFFFFFFF);
                  }

                  private void stepperRow(DrawContext c, int mx, int my, int x, int y, int w, int h, String label, String value) {
                      row(c, x, y, w, h, label, false);
                      int vw = this.textRenderer.getWidth(value);
                      c.drawTextWithShadow(this.textRenderer, Text.literal(value), x + w - 48 - vw, y + (h - 8) / 2, 0xFFBFC5CE);
                      boolean hm = hov(mx, my, x + w - 46, y, 15, h);
                      boolean hp = hov(mx, my, x + w - 17, y, 17, h);
                      rr(c, x + w - 44, y + 3, 12, h - 6, 3, hm ? 0x55FFFFFF : 0x2AFFFFFF);
                      rr(c, x + w - 14, y + 3, 12, h - 6, 3, hp ? 0x55FFFFFF : 0x2AFFFFFF);
                      c.drawCenteredTextWithShadow(this.textRenderer, Text.literal("-"), x + w - 38, y + (h - 8) / 2, 0xFFFFFFFF);
                      c.drawCenteredTextWithShadow(this.textRenderer, Text.literal("+"), x + w - 8, y + (h - 8) / 2, 0xFFFFFFFF);
                  }

                  private void actionRow(DrawContext c, int mx, int my, int x, int y, int w, int h, String label) {
                      row(c, x, y, w, h, label, hov(mx, my, x, y, w, h));
                      c.drawTextWithShadow(this.textRenderer, Text.literal(">"), x + w - 12, y + (h - 8) / 2, 0xFF8FB8FF);
                  }

                  @Override
                  public void renderBackground(DrawContext context, int mouseX, int mouseY, float delta) {
                  }

                  @Override
                  public void render(DrawContext c, int mx, int my, float delta) {
                      c.fill(0, 0, this.width, this.height, 0x66000000);
                      c.drawCenteredTextWithShadow(this.textRenderer, this.title, this.width / 2, Math.max(4, cardsY - 16), 0xFFFFFFFF);
                      Config cfg = Config.get();

                      // Kartu 0: Umum
                      int x = cardX(0);
                      int y = cardsY + 32;
                      card(c, x, "Umum", BLUE);
                      toggleRow(c, mx, my, x, y, cw, 20, "Skin transparan", cfg.enabled);
                      toggleRow(c, mx, my, x, y + 22, cw, 20, "Berlaku semua", cfg.everyone);

                      // Kartu 1: Tubuh
                      x = cardX(1);
                      y = cardsY + 32;
                      card(c, x, "Tubuh", 0xFF22C55E);
                      for (int i = 0; i < 12; i++) {
                          boolean outer = i >= 6;
                          String name = outer ? OUTER_NAMES[i - 6] : BASE_NAMES[i];
                          boolean hidden = outer ? cfg.hideOuter[i - 6] : cfg.hideBase[i];
                          toggleRow(c, mx, my, x, y + i * 18, cw, 17, (outer ? "Outer " : "") + name, !hidden);
                      }

                      // Kartu 2: Cosmetic
                      x = cardX(2);
                      y = cardsY + 32;
                      card(c, x, "Cosmetic", 0xFFA855F7);
                      toggleRow(c, mx, my, x, y, cw, 20, "Sembunyikan asli", cfg.cosmeticHideOriginal);
                      List<Cosmetics.Loaded> all = Cosmetics.ALL;
                      int per = 8;
                      int pages = Math.max(1, (all.size() + per - 1) / per);
                      for (int i = 0; i < per; i++) {
                          int idx = cosPage * per + i;
                          if (idx >= all.size()) {
                              break;
                          }
                          Cosmetics.Loaded l = all.get(idx);
                          String label = l.display.length() > 15 ? l.display.substring(0, 14) + "." : l.display;
                          toggleRow(c, mx, my, x, y + 22 + i * 22, cw, 20, label, Cosmetics.isSelected(l));
                      }
                      int navY = y + 22 + per * 22;
                      boolean hl = hov(mx, my, x, navY, cw / 2 - 2, 20);
                      boolean hr = hov(mx, my, x + cw / 2 + 2, navY, cw / 2 - 2, 20);
                      rr(c, x, navY, cw / 2 - 2, 20, 5, hl ? 0x44FFFFFF : 0x22FFFFFF);
                      rr(c, x + cw / 2 + 2, navY, cw / 2 - 2, 20, 5, hr ? 0x44FFFFFF : 0x22FFFFFF);
                      c.drawCenteredTextWithShadow(this.textRenderer, Text.literal("<"), x + cw / 4 - 1, navY + 6, 0xFFFFFFFF);
                      c.drawCenteredTextWithShadow(this.textRenderer, Text.literal((cosPage + 1) + "/" + pages), x + cw / 2, navY + 6, 0xFFBFC5CE);
                      c.drawCenteredTextWithShadow(this.textRenderer, Text.literal(">"), x + cw * 3 / 4 + 1, navY + 6, 0xFFFFFFFF);
                      actionRow(c, mx, my, x, navY + 22, cw, 20, "Muat ulang folder");

                      // Kartu 3: Preview & fitur
                      x = cardX(3);
                      y = cardsY + 32;
                      card(c, x, "Preview & fitur", 0xFFF59E0B);
                      actionRow(c, mx, my, x, y + 66, cw, 20, "Killstreak");
                      actionRow(c, mx, my, x, y + 88, cw, 20, "Hitsound");
                      actionRow(c, mx, my, x, y + 110, cw, 20, "Musik");
                      actionRow(c, mx, my, x, y + 132, cw, 20, "Foto");

                      // Footer
                      int fy = Math.min(this.height - 22, cardsY + cardsH + 10);
                      boolean hf = hov(mx, my, this.width / 2 - 60, fy, 120, 20);
                      rr(c, this.width / 2 - 60, fy, 120, 20, 6, hf ? 0x553B82F6 : 0x33FFFFFF);
                      c.drawCenteredTextWithShadow(this.textRenderer, Text.literal("Selesai"), this.width / 2, fy + 6, 0xFFFFFFFF);

                      super.render(c, mx, my, delta);
                  }

                  @Override
                  public boolean shouldPause() {
                      return false;
                  }

                  @Override
                  public void close() {
                      Config.save();
                      if (this.client != null) {
                          this.client.setScreen(this.parent);
                      }
                  }
              }

              public static final class Accounts {
                  private Accounts() {
                  }

                  public static String currentName() {
                      Config c = Config.get();
                      if (c.currentAccount != null && !c.currentAccount.isEmpty()) {
                          return c.currentAccount;
                      }
                      try {
                          return MinecraftClient.getInstance().getSession().getUsername();
                      } catch (Throwable t) {
                          return "?";
                      }
                  }

                  public static boolean valid(String n) {
                      return n != null && n.matches("[A-Za-z0-9_]{1,16}");
                  }

                  public static void switchTo(String name) throws Exception {
                      UUID uuid = UUID.nameUUIDFromBytes(("OfflinePlayer:" + name).getBytes(StandardCharsets.UTF_8));
                      Session session = new Session(name, uuid, "0", Optional.empty(), Optional.empty());
                      MinecraftClient mc = MinecraftClient.getInstance();
                      boolean done = false;
                      for (Field f : MinecraftClient.class.getDeclaredFields()) {
                          if (Modifier.isStatic(f.getModifiers())) {
                              continue;
                          }
                          if (f.getType() == Session.class) {
                              f.setAccessible(true);
                              f.set(mc, session);
                              done = true;
                          } else if (f.getType() == GameProfile.class) {
                              try {
                                  f.setAccessible(true);
                                  f.set(mc, new GameProfile(uuid, name));
                              } catch (Throwable ignored) {
                              }
                          }
                      }
                      if (!done) {
                          throw new IllegalStateException("field session tidak ditemukan");
                      }
                      Config.get().currentAccount = name;
                      Config.save();
                  }
              }

              private static final class RangeSlider extends SliderWidget {
                  private final String label;
                  private final int min;
                  private final int max;
                  private final IntConsumer setter;

                  RangeSlider(int x, int y, int width, int height, String label, int min, int max, int value, IntConsumer setter) {
                      super(x, y, width, height, Text.empty(), (value - min) / (double) (max - min));
                      this.label = label;
                      this.min = min;
                      this.max = max;
                      this.setter = setter;
                      this.updateMessage();
                  }

                  private int current() {
                      return this.min + (int) Math.round(this.value * (this.max - this.min));
                  }

                  @Override
                  protected void updateMessage() {
                      String l = this.label == null ? "" : this.label;
                      this.setMessage(Text.literal(l + ": " + current() + "%"));
                  }

                  @Override
                  protected void applyValue() {
                      if (this.setter != null) {
                          this.setter.accept(current());
                      }
                  }
              }

              // ------------------------------------------------------------------
              // Skin: baca file .png (64x64) dari config/transparent-skin/skins
              // ------------------------------------------------------------------
              public static final class Skins {
                  public static final class Loaded {
                      public final String name;
                      public final Identifier id;

                      Loaded(String name, Identifier id) {
                          this.name = name;
                          this.id = id;
                      }
                  }

                  public static final List<Loaded> ALL = new ArrayList<>();
                  public static String error = "";
                  private static LoadedEntityModels models;
                  private static Identifier cachedId;
                  private static SkinTextures cachedBase;
                  private static SkinTextures cachedResult;

                  private Skins() {
                  }

                  public static Path dir() {
                      return FabricLoader.getInstance().getConfigDir().resolve("transparent-skin").resolve("skins");
                  }

                  public static LoadedEntityModels models() {
                      if (models == null) {
                          models = LoadedEntityModels.copy();
                      }
                      return models;
                  }

                  public static void reload() {
                      ALL.clear();
                      error = "";
                      CACHE.clear();
                      try {
                          Files.createDirectories(dir());
                      } catch (Throwable t) {
                          error = String.valueOf(t);
                      }
                      try (Stream<Path> st = Files.list(dir())) {
                          List<Path> files = new ArrayList<>();
                          st.forEach(files::add);
                          files.sort((a, b) -> a.getFileName().toString().compareToIgnoreCase(b.getFileName().toString()));
                          for (Path p : files) {
                              String fn = p.getFileName().toString();
                              if (!fn.toLowerCase().endsWith(".png")) {
                                  continue;
                              }
                              String base = fn.substring(0, fn.length() - 4);
                              try (InputStream in = Files.newInputStream(p)) {
                                  NativeImage img = NativeImage.read(in);
                                  if (img.getWidth() != 64 || img.getHeight() != 64) {
                                      img.close();
                                      throw new IllegalStateException("skin harus 64x64");
                                  }
                                  String key = base.toLowerCase().replaceAll("[^a-z0-9_.-]", "_");
                                  Identifier id = Identifier.of("transparentskin", "skin/" + key);
                                  final String texName = "transparentskin_skin_" + key;
                                  NativeImageBackedTexture tex = new NativeImageBackedTexture(() -> texName, img);
                                  MinecraftClient.getInstance().getTextureManager().registerTexture(id, tex);
                                  ALL.add(new Loaded(base, id));
                              } catch (Throwable t) {
                                  error = fn + ": " + t.getMessage();
                              }
                          }
                      } catch (Throwable t) {
                          error = String.valueOf(t);
                      }
                  }

                  public static Identifier selectedId() {
                      String sel = Config.get().selectedSkin;
                      if (sel == null || sel.isEmpty()) {
                          return null;
                      }
                      for (Loaded l : ALL) {
                          if (l.name.equals(sel)) {
                              return l.id;
                          }
                      }
                      return null;
                  }

                  private static final Map<String, SkinTextures> CACHE = new HashMap<>();

                  public static void clearCache() {
                      CACHE.clear();
                  }

                  public static SkinTextures defaultBase() {
                      String name = Accounts.currentName();
                      UUID uuid = UUID.nameUUIDFromBytes(("OfflinePlayer:" + name).getBytes(StandardCharsets.UTF_8));
                      return DefaultSkinHelper.getSkinTextures(uuid);
                  }

                  /** model skin: pilihan user (wide/slim) kalau ada, kalau belum ikut model akun */
                  public static boolean isSlim(String name, SkinTextures base) {
                      Boolean v = Config.get().skinSlim.get(name);
                      if (v != null) {
                          return v;
                      }
                      return base != null && base.model() == PlayerSkinType.SLIM;
                  }

                  private static AssetInfo.TextureAsset asset(Identifier f) {
                      return new AssetInfo.TextureAsset() {
                          @Override
                          public Identifier id() {
                              return f;
                          }

                          @Override
                          public Identifier texturePath() {
                              return f;
                          }
                      };
                  }

                  private static SkinTextures build(String name, AssetInfo.TextureAsset body, SkinTextures base) {
                      PlayerSkinType model = isSlim(name, base) ? PlayerSkinType.SLIM : PlayerSkinType.WIDE;
                      String key = name + "|" + System.identityHashCode(base) + "|" + model;
                      SkinTextures cached = CACHE.get(key);
                      if (cached != null) {
                          return cached;
                      }
                      SkinTextures result = SkinTextures.create(body, base.cape(), base.elytra(), model);
                      if (CACHE.size() > 200) {
                          CACHE.clear();
                      }
                      CACHE.put(key, result);
                      return result;
                  }

                  /** ganti texture body dengan skin pilihan, dan cape dengan cape pilihan */
                  public static SkinTextures apply(SkinTextures base) {
                      if (base == null) {
                          return base;
                      }
                      Identifier id = selectedId();
                      if (id == null) {
                          return base;
                      }
                      String name = Config.get().selectedSkin == null ? "" : Config.get().selectedSkin;
                      return build(name, asset(id), base);
                  }

                  public static SkinTextures texturesFor(String name) {
                      SkinTextures base = defaultBase();
                      Identifier id = null;
                      if (name != null && !name.isEmpty()) {
                          for (Loaded l : ALL) {
                              if (l.name.equals(name)) {
                                  id = l.id;
                                  break;
                              }
                          }
                      }
                      if (id == null) {
                          return base;
                      }
                      return build(name == null ? "" : name, asset(id), base);
                  }

                  public static SkinTextures previewTextures() {
                      return texturesFor(Config.get().selectedSkin);
                  }
              }

              public static final class WardrobeScreen extends Screen {
                  private static final int BLUE = 0xFF1F4E8C;
                  private static final int BLUE_HOVER = 0xFF2B63AE;

                  private static final class Btn {
                      final int x;
                      final int y;
                      final int w;
                      final int h;
                      final String label;
                      final int style; // 0 gelap, 1 biru, 2 ikon cari, 3 tombol Wide, 4 tombol Slim

                      Btn(int x, int y, int w, int h, String label, int style) {
                          this.x = x;
                          this.y = y;
                          this.w = w;
                          this.h = h;
                          this.label = label;
                          this.style = style;
                      }
                  }

                  private static final class Card {
                      final int x;
                      final int y;
                      final int w;
                      final int h;
                      final String label;
                      final String sub;
                      final boolean selected;

                      Card(int x, int y, int w, int h, String label, String sub, boolean selected) {
                          this.x = x;
                          this.y = y;
                          this.w = w;
                          this.h = h;
                          this.label = label;
                          this.sub = sub;
                          this.selected = selected;
                      }
                  }

                  private final Screen parent;
                  private int tab = 0; // 0 skin, 1 cosmetic
                  private int pageIdx = 0;
                  private int pageCount = 1;
                  private boolean searching = false;
                  private String filter = "";
                  private String status = "";
                  private TextFieldWidget searchField;
                  private int px;
                  private int py;
                  private int pw;
                  private int ph;
                  private int sideW;
                  private int centerW;
                  private int cx0;
                  private int rx;
                  private int rw;
                  private int gx;
                  private int gy;
                  private int cardW;
                  private int cardH;
                  private int rowH;
                  private int per;
                  private final List<Btn> btns = new ArrayList<>();
                  private final List<Card> cards = new ArrayList<>();
                  private final List<ClickableWidget> dyn = new ArrayList<>();

                  public WardrobeScreen(Screen parent) {
                      super(Text.literal("Wardrobe"));
                      this.parent = parent;
                  }

                  private ButtonWidget addClick(int x, int y, int w, int h, Runnable r) {
                      ButtonWidget b = ButtonWidget.builder(Text.empty(), btn -> r.run()).dimensions(x, y, w, h).build();
                      b.setAlpha(0f);
                      this.addDrawableChild(b);
                      return b;
                  }

                  @Override
                  protected void init() {
                      btns.clear();
                      cards.clear();
                      dyn.clear();
                      pw = Math.min(this.width - 8, 560);
                      ph = Math.min(this.height - 8, 300);
                      px = (this.width - pw) / 2;
                      py = (this.height - ph) / 2;
                      sideW = 66;
                      rw = (pw - sideW) * 40 / 100;
                      centerW = pw - sideW - rw;
                      cx0 = px + sideW;
                      rx = cx0 + centerW;

                      addClick(px + 3, py + 4, 16, 16, this::close);
                      btns.add(new Btn(px + 3, py + 4, 16, 16, "<", 0));

                      addClick(px + 2, py + 30, sideW - 4, 20, () -> switchTab(0));
                      addClick(px + 2, py + 52, sideW - 4, 20, () -> switchTab(1));

                      int hx = cx0 + centerW - 6 - 16;
                      addClick(hx, py + 4, 16, 16, () -> {
                          searching = !searching;
                          if (!searching) {
                              filter = "";
                          }
                          pageIdx = 0;
                          this.clearAndInit();
                      });
                      btns.add(new Btn(hx, py + 4, 16, 16, "", 2));
                      int leftLimit = hx - 4;
                      if (tab == 0) {
                          int aw = 58;
                          int ax = hx - 4 - aw;
                          addClick(ax, py + 4, aw, 16, this::addSkin);
                          btns.add(new Btn(ax, py + 4, aw, 16, "+ Add Skin", 1));
                          leftLimit = ax - 4;
                      }
                      if (searching) {
                          searchField = new TextFieldWidget(this.textRenderer, cx0 + 6, py + 4, Math.max(40, leftLimit - (cx0 + 6)), 16, Text.literal("Cari"));
                          searchField.setPlaceholder(Text.literal("Cari..."));
                          searchField.setText(filter);
                          searchField.setChangedListener(t -> {
                              filter = t;
                              pageIdx = 0;
                              rebuildGrid();
                          });
                          this.addDrawableChild(searchField);
                      }

                      addClick(rx + 6, py + 4, 30, 16, () -> setSlim(false));
                      btns.add(new Btn(rx + 6, py + 4, 30, 16, "Wide", 3));
                      addClick(rx + 40, py + 4, 30, 16, () -> setSlim(true));
                      btns.add(new Btn(rx + 40, py + 4, 30, 16, "Slim", 4));
                      addClick(rx + 78, py + 4, 16, 16, () -> cycle(-1));
                      btns.add(new Btn(rx + 78, py + 4, 16, 16, "<", 0));
                      addClick(rx + rw - 22, py + 4, 16, 16, () -> cycle(1));
                      btns.add(new Btn(rx + rw - 22, py + 4, 16, 16, ">", 0));

                      gx = cx0 + 6;
                      gy = py + 28;
                      int gw = centerW - 12;
                      cardW = (gw - 10) / 3;
                      cardH = Math.max(36, Math.round(cardW * 1.1f));
                      rowH = cardH + 12;
                      int rows = Math.max(1, (ph - 28 - 16) / rowH);
                      per = 3 * rows;

                      int py2 = py + ph - 14;
                      addClick(cx0 + centerW - 6 - 34, py2, 16, 12, () -> page(-1));
                      btns.add(new Btn(cx0 + centerW - 6 - 34, py2, 16, 12, "<", 0));
                      addClick(cx0 + centerW - 6 - 16, py2, 16, 12, () -> page(1));
                      btns.add(new Btn(cx0 + centerW - 6 - 16, py2, 16, 12, ">", 0));

                      rebuildGrid();
                  }

                  private void switchTab(int t) {
                      tab = t;
                      pageIdx = 0;
                      filter = "";
                      searching = false;
                      this.clearAndInit();
                  }

                  private void page(int dir) {
                      pageIdx = Math.max(0, pageIdx + dir);
                      rebuildGrid();
                  }

                  private void addSkin() {
                      Skins.reload();
                      status = Skins.error.isEmpty() ? "Taruh PNG 64x64 di config/transparent-skin/skins" : Skins.error;
                      rebuildGrid();
                  }

                  private String currentSkin() {
                      String c = Config.get().selectedSkin;
                      return c == null ? "" : c;
                  }

                  private void selectSkin(String n) {
                      Config.get().selectedSkin = n;
                      Config.save();
                      rebuildGrid();
                  }

                  private void setSlim(boolean slim) {
                      String cur = currentSkin();
                      if (cur.isEmpty()) {
                          return;
                      }
                      Config.get().skinSlim.put(cur, slim);
                      Config.save();
                      Skins.clearCache();
                  }

                  private void cycle(int dir) {
                      List<String> all = new ArrayList<>();
                      all.add("");
                      for (Skins.Loaded l : Skins.ALL) {
                          all.add(l.name);
                      }
                      int idx = Math.max(0, all.indexOf(currentSkin()));
                      int next = ((idx + dir) % all.size() + all.size()) % all.size();
                      selectSkin(all.get(next));
                  }

                  private List<String> skinNames() {
                      String f = filter.toLowerCase();
                      List<String> r = new ArrayList<>();
                      if (f.isEmpty() || "default".contains(f)) {
                          r.add("");
                      }
                      for (Skins.Loaded l : Skins.ALL) {
                          if (f.isEmpty() || l.name.toLowerCase().contains(f)) {
                              r.add(l.name);
                          }
                      }
                      return r;
                  }

                  private List<Cosmetics.Loaded> cosmeticItems() {
                      String f = filter.toLowerCase();
                      List<Cosmetics.Loaded> r = new ArrayList<>();
                      for (Cosmetics.Loaded l : Cosmetics.ALL) {
                          if (f.isEmpty() || l.display.toLowerCase().contains(f)) {
                              r.add(l);
                          }
                      }
                      return r;
                  }

                  private void rebuildGrid() {
                      for (ClickableWidget w : dyn) {
                          this.remove(w);
                      }
                      dyn.clear();
                      cards.clear();
                      String cur = currentSkin();

                      if (tab == 0) {
                          List<String> names = skinNames();
                          pageCount = Math.max(1, (names.size() + per - 1) / per);
                          pageIdx = Math.min(pageIdx, pageCount - 1);
                          for (int i = 0; i < per; i++) {
                              int idx = pageIdx * per + i;
                              if (idx >= names.size()) {
                                  break;
                              }
                              String n = names.get(idx);
                              int x = gx + (i % 3) * (cardW + 5);
                              int y = gy + (i / 3) * rowH;
                              cards.add(new Card(x, y, cardW, cardH, n.isEmpty() ? "Default" : n, "", n.equals(cur)));
                              dyn.add(addClick(x, y, cardW, cardH, () -> selectSkin(n)));
                              PlayerSkinWidget sw = new PlayerSkinWidget(cardW - 6, cardH - 6, Skins.models(), () -> Skins.texturesFor(n));
                              sw.setPosition(x + 3, y + 3);
                              this.addDrawableChild(sw);
                              dyn.add(sw);
                          }
                      } else {
                          List<Cosmetics.Loaded> items = cosmeticItems();
                          pageCount = Math.max(1, (items.size() + per - 1) / per);
                          pageIdx = Math.min(pageIdx, pageCount - 1);
                          for (int i = 0; i < per; i++) {
                              int idx = pageIdx * per + i;
                              if (idx >= items.size()) {
                                  break;
                              }
                              Cosmetics.Loaded l = items.get(idx);
                              int x = gx + (i % 3) * (cardW + 5);
                              int y = gy + (i / 3) * rowH;
                              cards.add(new Card(x, y, cardW, cardH, l.display, Cosmetics.SLOT_LABELS[l.slot], Cosmetics.isSelected(l)));
                              dyn.add(addClick(x, y, cardW, cardH, () -> {
                                  Cosmetics.toggle(l);
                                  rebuildGrid();
                              }));
                          }
                      }

                      PlayerSkinWidget big = new PlayerSkinWidget(Math.max(40, rw - 16), Math.max(60, ph - 34), Skins.models(),
                              () -> Skins.texturesFor(Config.get().selectedSkin));
                      big.setPosition(rx + 8, py + 28);
                      this.addDrawableChild(big);
                      dyn.add(big);
                  }

                  private static void border(DrawContext ctx, int x, int y, int w, int h, int color) {
                      ctx.fill(x, y, x + w, y + 1, color);
                      ctx.fill(x, y + h - 1, x + w, y + h, color);
                      ctx.fill(x, y, x + 1, y + h, color);
                      ctx.fill(x + w - 1, y, x + w, y + h, color);
                  }

                  private void centerText(DrawContext ctx, String text, int x, int y, int w, int h, int color) {
                      int tw = this.textRenderer.getWidth(text);
                      ctx.drawTextWithShadow(this.textRenderer, Text.literal(text), x + (w - tw) / 2, y + (h - 8) / 2, color);
                  }

                  private void drawAll(DrawContext ctx, int mx, int my) {
                      ctx.fill(0, 0, this.width, this.height, 0xFF121212);
                      ctx.fill(px, py, px + pw, py + ph, 0xFF1B1B1B);
                      border(ctx, px, py, pw, ph, 0xFF2E2E2E);
                      ctx.fill(px, py, px + sideW, py + ph, 0xFF181818);
                      ctx.fill(cx0, py, cx0 + centerW, py + 24, 0xFF202020);
                      ctx.fill(rx, py, rx + rw, py + 24, 0xFF202020);
                      ctx.fill(px, py + 24, px + sideW, py + 25, 0xFF2E2E2E);
                      ctx.fill(cx0, py, cx0 + 1, py + ph, 0xFF2E2E2E);
                      ctx.fill(rx, py, rx + 1, py + ph, 0xFF2E2E2E);

                      // sidebar
                      ctx.drawTextWithShadow(this.textRenderer, Text.literal("Wardrobe"), px + 22, py + 8, 0xFFFFFFFF);
                      if (tab == 0) {
                          ctx.fill(px + 2, py + 30, px + sideW - 2, py + 50, 0xFF262626);
                      } else {
                          ctx.fill(px + 2, py + 52, px + sideW - 2, py + 72, 0xFF262626);
                      }
                      ctx.drawTextWithShadow(this.textRenderer, Text.literal("Skins \u2605"), px + 8, py + 36, 0xFFE79BEA);
                      ctx.drawTextWithShadow(this.textRenderer, Text.literal("Cosmetics"), px + 8, py + 58, 0xFFFFE04A);

                      // judul tengah / kanan
                      if (!searching) {
                          String head = tab == 0 ? "Skins [" + Skins.ALL.size() + "/128]" : "Cosmetics [" + Cosmetics.ALL.size() + "]";
                          ctx.drawTextWithShadow(this.textRenderer, Text.literal(head), cx0 + 8, py + 8, 0xFFFFFFFF);
                      }
                      String cur = currentSkin();
                      String shown = cur.isEmpty() ? "Default" : cur;
                      shown = this.textRenderer.trimToWidth(shown, Math.max(20, rw - 78 - 22 - 24));
                      centerText(ctx, shown, rx + 96, py + 4, Math.max(20, rw - 78 - 22 - 20), 16, 0xFFFFFFFF);

                      // tombol
                      boolean slim = Skins.isSlim(cur, Skins.defaultBase());
                      for (Btn b : btns) {
                          boolean hover = mx >= b.x && mx < b.x + b.w && my >= b.y && my < b.y + b.h;
                          boolean disabled = false;
                          boolean active = false;
                          if (b.style == 3 || b.style == 4) {
                              disabled = cur.isEmpty();
                              active = !disabled && ((b.style == 4) == slim);
                          }
                          int bg;
                          if (b.style == 1 || active) {
                              bg = hover ? BLUE_HOVER : BLUE;
                          } else {
                              bg = hover ? 0xFF3A3A3A : 0xFF2A2A2A;
                          }
                          ctx.fill(b.x, b.y, b.x + b.w, b.y + b.h, bg);
                          if (!(b.style == 1 || active)) {
                              border(ctx, b.x, b.y, b.w, b.h, 0xFF3E3E3E);
                          }
                          if (b.style == 2) {
                              art(ctx, b.x + 4, b.y + 4, new String[]{
                                      ".###...", "#...#..", "#...#..", "#...#..", ".###...", ".....#.", "......#"});
                          } else if (!b.label.isEmpty()) {
                              centerText(ctx, b.label, b.x, b.y, b.w, b.h, disabled ? 0xFF777777 : 0xFFFFFFFF);
                          }
                      }

                      // kartu
                      for (Card c : cards) {
                          boolean hover = mx >= c.x && mx < c.x + c.w && my >= c.y && my < c.y + c.h;
                          ctx.fill(c.x, c.y, c.x + c.w, c.y + c.h, hover ? 0xFF282828 : 0xFF1E1E1E);
                          ctx.fill(c.x, c.y + c.h - 2, c.x + c.w, c.y + c.h, c.selected ? 0xFFFFFFFF : 0xFF6E6E6E);
                          if (c.selected) {
                              border(ctx, c.x, c.y, c.w, c.h, tab == 1 ? BLUE_HOVER : 0xFFE6E6E6);
                          }
                          if (!c.sub.isEmpty()) {
                              centerText(ctx, this.textRenderer.trimToWidth(c.sub, c.w - 4), c.x, c.y, c.w, c.h, 0xFFAAAAAA);
                          }
                          ctx.drawTextWithShadow(this.textRenderer, Text.literal(this.textRenderer.trimToWidth(c.label, c.w)),
                                  c.x, c.y + c.h + 3, 0xFFFFFFFF);
                      }

                      // status + halaman
                      if (!status.isEmpty()) {
                          String st = this.textRenderer.trimToWidth(status, centerW - 70);
                          ctx.drawTextWithShadow(this.textRenderer, Text.literal(st), cx0 + 6, py + ph - 12, 0xFFFFFF77);
                      }
                      ctx.drawTextWithShadow(this.textRenderer, Text.literal((pageIdx + 1) + "/" + pageCount),
                              cx0 + centerW - 6 - 34 - 26, py + ph - 12, 0xFFAAAAAA);
                      if (tab == 1 && Cosmetics.ALL.isEmpty()) {
                          ctx.drawTextWithShadow(this.textRenderer, Text.literal("Taruh .bbmodel di config/transparent-skin/cosmetics"),
                                  cx0 + 6, py + 30, 0xFFAAAAAA);
                      }
                  }

                  @Override
                  public void renderBackground(DrawContext context, int mouseX, int mouseY, float delta) {
                      // digambar manual di drawAll
                  }

                  @Override
                  public void render(DrawContext context, int mouseX, int mouseY, float delta) {
                      drawAll(context, mouseX, mouseY);
                      super.render(context, mouseX, mouseY, delta);
                  }

                  @Override
                  public boolean shouldPause() {
                      return false;
                  }

                  @Override
                  public void close() {
                      if (this.client != null) {
                          this.client.setScreen(this.parent);
                      }
                  }

                  @Override
                  public void removed() {
                      Config.save();
                      super.removed();
                  }
              }

              // ------------------------------------------------------------------
              // Inventory sorter: rapikan slot inventory utama (9..35) dengan satu klik
              // ------------------------------------------------------------------
              public static final class InvSorter {
                  private static final int FIRST = 9;
                  private static final int COUNT = 27;

                  private InvSorter() {
                  }

                  public static void sort(MinecraftClient mc) {
                      ClientPlayerEntity player = mc.player;
                      if (player == null || mc.interactionManager == null) {
                          return;
                      }
                      int syncId = player.currentScreenHandler.syncId;
                      for (int guard = 0; guard < 400; guard++) {
                          List<ItemStack> target = targetLayout(player);
                          int move = -1;
                          int from = -1;
                          for (int p = 0; p < COUNT; p++) {
                              ItemStack want = target.get(p);
                              ItemStack cur = player.getInventory().getStack(FIRST + p);
                              if (sameStack(cur, want)) {
                                  continue;
                              }
                              if (want.isEmpty()) {
                                  break;
                              }
                              for (int q = p + 1; q < COUNT && from < 0; q++) {
                                  if (sameStack(player.getInventory().getStack(FIRST + q), want)) {
                                      from = q;
                                  }
                              }
                              for (int q = p + 1; q < COUNT && from < 0; q++) {
                                  if (sameItem(player.getInventory().getStack(FIRST + q), want)) {
                                      from = q;
                                  }
                              }
                              if (from >= 0) {
                                  move = p;
                              }
                              break;
                          }
                          if (move < 0) {
                              return;
                          }
                          // ambil dari sumber, taruh di tujuan (tukar/gabung), lalu kembalikan sisa ke sumber
                          click(mc, syncId, FIRST + from);
                          click(mc, syncId, FIRST + move);
                          click(mc, syncId, FIRST + from);
                      }
                  }

                  private static void click(MinecraftClient mc, int syncId, int slot) {
                      mc.interactionManager.clickSlot(syncId, slot, 0, SlotActionType.PICKUP, mc.player);
                  }

                  private static List<ItemStack> targetLayout(ClientPlayerEntity player) {
                      List<ItemStack> list = new ArrayList<>();
                      for (int i = 0; i < COUNT; i++) {
                          ItemStack s = player.getInventory().getStack(FIRST + i);
                          if (!s.isEmpty()) {
                              list.add(s.copy());
                          }
                      }
                      list.sort(Comparator
                              .comparing((ItemStack s) -> Registries.ITEM.getId(s.getItem()).toString())
                              .thenComparing(Comparator.comparingInt(ItemStack::getCount).reversed()));
                      while (list.size() < COUNT) {
                          list.add(ItemStack.EMPTY);
                      }
                      return list;
                  }

                  private static boolean sameStack(ItemStack a, ItemStack b) {
                      if (a.isEmpty() || b.isEmpty()) {
                          return a.isEmpty() && b.isEmpty();
                      }
                      return ItemStack.areItemsAndComponentsEqual(a, b) && a.getCount() == b.getCount();
                  }

                  private static boolean sameItem(ItemStack a, ItemStack b) {
                      return !a.isEmpty() && !b.isEmpty() && a.getItem() == b.getItem();
                  }
              }

              // ------------------------------------------------------------------
              // Toggle sprint + HUD status (Sprint [toggled] dan indikator shield)
              // ------------------------------------------------------------------
              public static final class HudExtras {
                  private static KeyBinding toggleKey;
                  public static boolean sprintToggled = false;

                  private HudExtras() {
                  }

                  public static void init() {
                      toggleKey = KeyBindingHelper.registerKeyBinding(new KeyBinding(
                              "key.transparentskin.toggle_sprint",
                              InputUtil.Type.KEYSYM,
                              GLFW.GLFW_KEY_R,
                              KeyBinding.Category.MISC));

                      HudRenderCallback.EVENT.register((ctx, tickDelta) -> {
                          try {
                              render(ctx, tickDelta);
                          } catch (Throwable ignored) {
                          }
                      });
                  }

                  public static void tick(MinecraftClient mc) {
                      while (toggleKey != null && toggleKey.wasPressed()) {
                          sprintToggled = !sprintToggled;
                      }
                      if (mc.player == null || mc.currentScreen != null) {
                          return;
                      }
                      boolean canSprint = sprintToggled
                              && mc.options.forwardKey.isPressed()
                              && !mc.player.isSneaking()
                              && mc.player.getHungerManager().getFoodLevel() > 6;
                      if (canSprint) {
                          mc.player.setSprinting(true);
                      } else if (sprintToggled && !mc.options.forwardKey.isPressed()) {
                          mc.player.setSprinting(false);
                      }
                  }

                  private static void render(DrawContext ctx, RenderTickCounter tickCounter) {
                      MinecraftClient mc = MinecraftClient.getInstance();
                      if (mc.player == null || mc.options.hudHidden) {
                          return;
                      }
                      int sh = ctx.getScaledWindowHeight();
                      float delta = tickCounter.getTickProgress(true);

                      int bottomY = sh - 12;
                      if (sprintToggled) {
                          ctx.drawTextWithShadow(mc.textRenderer, Text.literal("Sprint [toggled]"), 4, bottomY, 0xFFFFFFFF);
                      }
                  }
              }

              // ------------------------------------------------------------------
              // Music player: MP3 dari config/transparent-skin/music, diputar lewat OpenAL
              // ------------------------------------------------------------------
              public static final class Music {
                  public static final List<String> LIBRARY = new ArrayList<>();
                  private static final Map<String, CompletableFuture<Pcm>> LOADING = new HashMap<>();
                  private static final Random RNG = new Random();
                  /** AL_SAMPLE_OFFSET (OpenAL 1.1), dipakai langsung karena AL10 tidak punya konstanta ini */
                  private static final int SAMPLE_OFFSET = 0x1025;
                  private static final int SOURCE_RELATIVE = 0x202;
                  private static final int AL_TRUE = 1;
                  private static int source = -1;
                  private static int buffer = -1;
                  private static String loaded = null;
                  private static String wantPlay = null;
                  private static boolean playing = false;
                  private static int frames = 0;
                  private static int rate = 44100;
                  public static String error = "";

                  private record Pcm(ByteBuffer data, int rate, int format, int frames) {
                  }

                  private Music() {
                  }

                  public static Path dir() {
                      return FabricLoader.getInstance().getConfigDir().resolve("transparent-skin").resolve("music");
                  }

                  public static void reload() {
                      LIBRARY.clear();
                      try {
                          Files.createDirectories(dir());
                          try (Stream<Path> st = Files.list(dir())) {
                              List<Path> files = new ArrayList<>();
                              st.forEach(files::add);
                              files.sort((a, b) -> a.getFileName().toString().compareToIgnoreCase(b.getFileName().toString()));
                              for (Path p : files) {
                                  String fn = p.getFileName().toString();
                                  if (fn.toLowerCase().endsWith(".mp3")) {
                                      LIBRARY.add(fn);
                                  }
                              }
                          }
                      } catch (Throwable t) {
                          error = String.valueOf(t.getMessage());
                      }
                  }

                  public static String current() {
                      return loaded;
                  }

                  public static boolean isPlaying() {
                      return playing;
                  }

                  public static int durationFrames() {
                      return frames;
                  }

                  public static int positionFrames() {
                      if (source < 0 || loaded == null) {
                          return 0;
                      }
                      return AL10.alGetSourcei(source, SAMPLE_OFFSET);
                  }

                  public static double fraction() {
                      return frames > 0 ? Math.min(1.0, positionFrames() / (double) frames) : 0.0;
                  }

                  public static void seekFraction(double f) {
                      if (source < 0 || loaded == null || frames <= 0) {
                          return;
                      }
                      int target = (int) Math.max(0, Math.min(frames - 1, f * frames));
                      AL10.alSourcei(source, SAMPLE_OFFSET, target);
                  }

                  public static String timeText(int frame) {
                      int sec = frame / Math.max(1, rate);
                      return (sec / 60) + ":" + String.format("%02d", sec % 60);
                  }

                  private static Pcm decode(Path p) throws Exception {
                      byte[] head = new byte[12];
                      int got;
                      try (InputStream hin = Files.newInputStream(p)) {
                          got = hin.read(head);
                      }
                      if (got >= 8 && head[4] == 'f' && head[5] == 't' && head[6] == 'y' && head[7] == 'p') {
                          throw new IllegalStateException("file ini M4A/MP4, bukan MP3 (ganti nama/convert ke MP3)");
                      }
                      ByteArrayOutputStream out = new ByteArrayOutputStream();
                      int rr = 44100;
                      int ch = 2;
                      try (InputStream in = Files.newInputStream(p)) {
                          Bitstream bs = new Bitstream(in);
                          Decoder dec = new Decoder();
                          Header h;
                          while ((h = bs.readFrame()) != null) {
                              SampleBuffer sb = (SampleBuffer) dec.decodeFrame(h, bs);
                              rr = sb.getSampleFrequency();
                              ch = sb.getChannelCount();
                              short[] pcm = sb.getBuffer();
                              int len = sb.getBufferLength();
                              for (int i = 0; i < len; i++) {
                                  short v = pcm[i];
                                  out.write(v & 0xFF);
                                  out.write((v >> 8) & 0xFF);
                              }
                              bs.closeFrame();
                          }
                      }
                      byte[] raw = out.toByteArray();
                      if (raw.length == 0) {
                          throw new IllegalStateException("MP3 tidak terbaca (0 audio), coba convert ulang ke MP3 standar");
                      }
                      ByteBuffer bb = ByteBuffer.allocateDirect(raw.length).order(ByteOrder.nativeOrder());
                      bb.put(raw).flip();
                      int fmt = ch == 1 ? AL10.AL_FORMAT_MONO16 : AL10.AL_FORMAT_STEREO16;
                      int fr = raw.length / (ch * 2);
                      return new Pcm(bb, rr, fmt, fr);
                  }

                  private static void ensureSource() {
                      if (source < 0) {
                          source = AL10.alGenSources();
                          buffer = AL10.alGenBuffers();
                          AL10.alSourcei(source, SOURCE_RELATIVE, AL_TRUE);
                          AL10.alSource3f(source, AL10.AL_POSITION, 0f, 0f, 0f);
                      }
                  }

                  /** info diagnosis untuk layar: state source, gain listener (volume Master Minecraft), dan error OpenAL */
                  public static String debug() {
                      if (source < 0) {
                          return "AL belum aktif";
                      }
                      int st = AL10.alGetSourcei(source, AL10.AL_SOURCE_STATE);
                      float listener = AL10.alGetListenerf(AL10.AL_GAIN);
                      int err = AL10.alGetError();
                      String stName = st == AL10.AL_PLAYING ? "main" : st == AL10.AL_PAUSED ? "jeda" : st == AL10.AL_STOPPED ? "berhenti" : "awal";
                      return "AL " + stName + " | master " + Math.round(listener * 100) + "% | err " + err;
                  }

                  public static void applyVolume() {
                      if (source >= 0) {
                          AL10.alSourcef(source, AL10.AL_GAIN, Config.get().musicVolume / 100f);
                      }
                  }

                  /** daftar putar aktif: playlist yang dipilih, atau seluruh library */
                  public static List<String> queue() {
                      Config c = Config.get();
                      if (c.activePlaylist >= 0 && c.activePlaylist < c.playlists.size()) {
                          return c.playlists.get(c.activePlaylist).songs;
                      }
                      return LIBRARY;
                  }

                  public static void play(String name) {
                      wantPlay = name;
                      LOADING.computeIfAbsent(name, n -> CompletableFuture.supplyAsync(() -> {
                          try {
                              return decode(dir().resolve(n));
                          } catch (Exception e) {
                              throw new RuntimeException(e);
                          }
                      }));
                  }

                  public static void togglePause() {
                      if (loaded == null && wantPlay == null) {
                          List<String> q = queue();
                          if (!q.isEmpty()) {
                              play(q.get(0));
                          }
                          return;
                      }
                      if (source < 0) {
                          return;
                      }
                      if (playing) {
                          AL10.alSourcePause(source);
                          playing = false;
                      } else if (loaded != null) {
                          AL10.alSourcePlay(source);
                          playing = true;
                      }
                  }

                  /** wrap = false berarti berhenti di lagu terakhir (untuk mode ulangi mati) */
                  public static void next(boolean wrap) {
                      List<String> list = queue();
                      if (list.isEmpty()) {
                          return;
                      }
                      int n = list.size();
                      int idx = list.indexOf(loaded);
                      if (Config.get().musicShuffle && n > 1) {
                          int r;
                          do {
                              r = RNG.nextInt(n);
                          } while (r == idx);
                          play(list.get(r));
                          return;
                      }
                      int ni = idx + 1;
                      if (ni >= n) {
                          if (!wrap) {
                              playing = false;
                              return;
                          }
                          ni = 0;
                      }
                      play(list.get(ni));
                  }

                  public static void prev() {
                      List<String> list = queue();
                      if (list.isEmpty()) {
                          return;
                      }
                      int n = list.size();
                      if (Config.get().musicShuffle && n > 1) {
                          next(true);
                          return;
                      }
                      int idx = list.indexOf(loaded);
                      play(list.get((idx - 1 + n) % n));
                  }

                  public static void tick() {
                      if (wantPlay != null) {
                          CompletableFuture<Pcm> f = LOADING.get(wantPlay);
                          if (f != null && f.isDone()) {
                              String name = wantPlay;
                              wantPlay = null;
                              LOADING.remove(name);
                              try {
                                  Pcm pcm = f.join();
                                  ensureSource();
                                  AL10.alSourceStop(source);
                                  AL10.alSourcei(source, AL10.AL_BUFFER, 0);
                                  AL10.alBufferData(buffer, pcm.format(), pcm.data(), pcm.rate());
                                  AL10.alSourcei(source, AL10.AL_BUFFER, buffer);
                                  loaded = name;
                                  frames = pcm.frames();
                                  rate = pcm.rate();
                                  applyVolume();
                                  AL10.alSourcePlay(source);
                                  playing = true;
                                  int st = AL10.alGetSourcei(source, AL10.AL_SOURCE_STATE);
                                  if (st != AL10.AL_PLAYING) {
                                      playing = false;
                                  }
                                  error = st == AL10.AL_PLAYING ? "" : "tidak main, " + debug();
                              } catch (Throwable t) {
                                  error = "gagal: " + t.getMessage();
                                  playing = false;
                              }
                          }
                      }
                      if (playing && source >= 0 && AL10.alGetSourcei(source, AL10.AL_SOURCE_STATE) == AL10.AL_STOPPED) {
                          playing = false;
                          int mode = Config.get().musicRepeat;
                          if (mode == 2) {
                              play(loaded);
                          } else {
                              next(mode == 1);
                          }
                      }
                  }
              }

              /** slider seek: nilai diikuti posisi lagu, geser = pindah menit */
              private static final class SeekSlider extends SliderWidget {
                  private long lastUser = 0L;

                  SeekSlider(int x, int y, int width, int height) {
                      super(x, y, width, height, Text.empty(), 0.0);
                  }

                  @Override
                  protected void updateMessage() {
                      this.setMessage(Text.empty());
                  }

                  @Override
                  protected void applyValue() {
                      lastUser = System.currentTimeMillis();
                      Music.seekFraction(this.value);
                  }

                  void sync() {
                      if (System.currentTimeMillis() - lastUser > 400) {
                          this.value = Music.fraction();
                      }
                  }
              }

              public static final class MusicScreen extends Screen {
                  private static final int BLUE_M = 0xFF1F4E8C;
                  private static final int BLUE_HOVER_M = 0xFF2B63AE;
                  private static final int BLUE_LINE_M = 0xFF3C8DF0;

                  private final Screen parent;
                  private int tab = 0;
                  private int openPl = -1;
                  private int pageIdx = 0;
                  private String status = "";
                  private TextFieldWidget nameField;
                  private SeekSlider seek;
                  private int px;
                  private int py;
                  private int pw;
                  private int ph;
                  private int sideW;
                  private int rightX;
                  private int rightW;
                  private int listX;
                  private int listY;
                  private int listW;
                  private int seekX;
                  private int seekY;
                  private int seekW;
                  private int transportY;

                  public MusicScreen(Screen parent) {
                      super(Text.literal("Music"));
                      this.parent = parent;
                  }

                  private ButtonWidget invisible(int x, int y, int w, int h, Runnable action) {
                      ButtonWidget b = ButtonWidget.builder(Text.empty(), btn -> action.run()).dimensions(x, y, w, h).build();
                      b.setAlpha(0f);
                      this.addDrawableChild(b);
                      return b;
                  }

                  private int startY() {
                      return (tab == 1 && openPl >= 0) ? listY + 26 : listY;
                  }

                  private int rowsVisible() {
                      return Math.max(2, (py + ph - 96 - startY()) / 22);
                  }

                  private List<String> entries() {
                      Config c = Config.get();
                      if (tab == 0) {
                          return new ArrayList<>(Music.LIBRARY);
                      }
                      if (openPl < 0) {
                          List<String> names = new ArrayList<>();
                          for (Playlist p : c.playlists) {
                              names.add(p.name);
                          }
                          return names;
                      }
                      return new ArrayList<>(c.playlists.get(openPl).songs);
                  }

                  private int pageCount() {
                      int n = entries().size();
                      return Math.max(1, (n + rowsVisible() - 1) / rowsVisible());
                  }

                  private void createPlaylist() {
                      Config c = Config.get();
                      c.playlists.add(new Playlist("Playlist " + (c.playlists.size() + 1)));
                      openPl = c.playlists.size() - 1;
                      Config.save();
                      pageIdx = 0;
                      this.clearAndInit();
                  }

                  private void openPlaylist(int idx) {
                      openPl = idx;
                      pageIdx = 0;
                      this.clearAndInit();
                  }

                  private void savePlaylistName() {
                      if (nameField == null || openPl < 0) {
                          return;
                      }
                      String n = nameField.getText().trim();
                      if (n.isEmpty()) {
                          status = "Nama playlist tidak boleh kosong";
                          return;
                      }
                      Config.get().playlists.get(openPl).name = n;
                      Config.save();
                      status = "Nama tersimpan";
                  }

                  private void deletePlaylist() {
                      Config c = Config.get();
                      if (openPl < 0) {
                          return;
                      }
                      c.playlists.remove(openPl);
                      if (c.activePlaylist == openPl) {
                          c.activePlaylist = -1;
                      } else if (c.activePlaylist > openPl) {
                          c.activePlaylist--;
                      }
                      openPl = -1;
                      pageIdx = 0;
                      Config.save();
                      this.clearAndInit();
                  }

                  private void playFromLibrary(String name) {
                      Config.get().activePlaylist = -1;
                      Config.save();
                      Music.play(name);
                  }

                  private void playFromPlaylist(String name) {
                      Config.get().activePlaylist = openPl;
                      Config.save();
                      Music.play(name);
                  }

                  private void addToOpen(String name) {
                      if (openPl < 0) {
                          status = "Buka playlist dulu di tab Playlists";
                          return;
                      }
                      List<String> songs = Config.get().playlists.get(openPl).songs;
                      if (!songs.contains(name)) {
                          songs.add(name);
                          Config.save();
                          status = "Ditambahkan ke playlist";
                      } else {
                          status = "Lagu sudah ada di playlist";
                      }
                  }

                  private void removeFromOpen(int idx) {
                      if (openPl < 0) {
                          return;
                      }
                      Config.get().playlists.get(openPl).songs.remove(idx);
                      Config.save();
                      this.clearAndInit();
                  }

                  @Override
                  protected void init() {
                      Music.reload();
                      Config c = Config.get();
                      if (openPl >= c.playlists.size()) {
                          openPl = -1;
                      }
                      int w = this.width;
                      int h = this.height;
                      px = Math.round(w * 0.07f);
                      py = Math.round(h * 0.126f);
                      pw = w - 2 * px;
                      ph = Math.round(h * 0.76f);
                      sideW = Math.round(pw * 0.135f);
                      rightW = Math.min(170, Math.round(pw * 0.3f));
                      rightX = px + pw - rightW;
                      listX = px + sideW + 6;
                      listW = rightX - listX - 8;
                      listY = py + 30;
                      seekX = px + 12;
                      seekW = pw - 24;
                      seekY = py + ph - 86;
                      transportY = py + ph - 56;

                      int pages = pageCount();
                      if (pageIdx >= pages) {
                          pageIdx = pages - 1;
                      }
                      if (pageIdx < 0) {
                          pageIdx = 0;
                      }

                      invisible(Math.max(4, px - 26), py + 2, 20, 20, this::close);
                      invisible(px, py + 26, sideW, 20, () -> {
                          tab = 0;
                          openPl = -1;
                          pageIdx = 0;
                          this.clearAndInit();
                      });
                      invisible(px, py + 48, sideW, 20, () -> {
                          tab = 1;
                          openPl = -1;
                          pageIdx = 0;
                          this.clearAndInit();
                      });

                      // navigasi halaman di header
                      invisible(px + pw - 84, py + 3, 18, 16, () -> {
                          if (pageIdx > 0) {
                              pageIdx--;
                              this.clearAndInit();
                          }
                      });
                      invisible(px + pw - 22, py + 3, 18, 16, () -> {
                          if (pageIdx < pageCount() - 1) {
                              pageIdx++;
                              this.clearAndInit();
                          }
                      });

                      // seek bar + transport
                      seek = new SeekSlider(seekX, seekY, seekW, 12);
                      this.addDrawableChild(seek);
                      int cx = px + pw / 2;
                      invisible(cx - 96, transportY, 40, 20, () -> {
                          Config.get().musicShuffle = !Config.get().musicShuffle;
                          Config.save();
                      });
                      invisible(cx - 50, transportY, 30, 20, Music::prev);
                      invisible(cx - 16, transportY, 32, 20, Music::togglePause);
                      invisible(cx + 20, transportY, 30, 20, () -> Music.next(true));
                      invisible(cx + 56, transportY, 40, 20, () -> {
                          Config.get().musicRepeat = (Config.get().musicRepeat + 1) % 3;
                          Config.save();
                      });

                      // panel kanan: volume dan playlist baru
                      this.addDrawableChild(new RangeSlider(rightX + 10, py + 64, rightW - 20, 20, "Volume", 0, 100,
                              c.musicVolume, v -> {
                                  Config.get().musicVolume = v;
                                  Music.applyVolume();
                              }));
                      if (tab == 1) {
                          invisible(rightX + 10, py + 92, rightW - 20, 20, this::createPlaylist);
                      }

                      // daftar lagu / playlist
                      if (tab == 1 && openPl >= 0) {
                          nameField = new TextFieldWidget(this.textRenderer, listX, listY, listW - 124, 20, Text.literal("Nama"));
                          nameField.setMaxLength(24);
                          nameField.setText(c.playlists.get(openPl).name);
                          this.addDrawableChild(nameField);
                          invisible(listX + listW - 120, listY, 58, 20, this::savePlaylistName);
                          invisible(listX + listW - 58, listY, 58, 20, this::deletePlaylist);
                      } else {
                          nameField = null;
                      }

                      List<String> list = entries();
                      int per = rowsVisible();
                      int start = startY();
                      for (int i = 0; i < per; i++) {
                          int idx = pageIdx * per + i;
                          if (idx >= list.size()) {
                              break;
                          }
                          final int fIdx = idx;
                          final String name = list.get(idx);
                          int y = start + i * 22;
                          if (tab == 0) {
                              invisible(listX, y, listW - 26, 20, () -> playFromLibrary(name));
                              invisible(listX + listW - 22, y, 20, 20, () -> addToOpen(name));
                          } else if (openPl < 0) {
                              invisible(listX, y, listW, 20, () -> openPlaylist(fIdx));
                          } else {
                              invisible(listX, y, listW - 26, 20, () -> playFromPlaylist(name));
                              invisible(listX + listW - 22, y, 20, 20, () -> removeFromOpen(fIdx));
                          }
                      }
                  }

                  private void btn(DrawContext c, int x, int y, int w, int h, String label, boolean hover, boolean active, boolean blue) {
                      int fill = blue ? (hover ? BLUE_HOVER_M : BLUE_M) : (active ? 0xFF38383D : (hover ? 0xFF303035 : 0xFF26262A));
                      GlassKit.box(c, x, y, x + w, y + h, fill);
                      if (active && !blue) {
                          GlassKit.box(c, x, y + h - 1, x + w, y + h, BLUE_LINE_M);
                      }
                      if (!label.isEmpty()) {
                          int tw = this.textRenderer.getWidth(label);
                          c.drawTextWithShadow(this.textRenderer, Text.literal(label), x + (w - tw) / 2, y + (h - 8) / 2, 0xFFFFFFFF);
                      }
                  }

                  /** ikon ulangi satu lagu: lingkaran dengan angka 1 di tengah */
                  private void repeatOneIcon(DrawContext c, int x, int y, int w, int h) {
                      String[] circle = {
                              "..###..", ".#...#.", "#.....#", "#.....#", "#.....#", "#.....#", ".#...#.", "..###.."};
                      int ox = x + (w - 7) / 2;
                      int oy = y + (h - 8) / 2;
                      for (int r = 0; r < circle.length; r++) {
                          for (int k = 0; k < circle[r].length(); k++) {
                              if (circle[r].charAt(k) == '#') {
                                  GlassKit.box(c, ox + k, oy + r, ox + k + 1, oy + r + 1, 0xFFFFFFFF);
                              }
                          }
                      }
                      c.drawTextWithShadow(this.textRenderer, Text.literal("1"), ox + 2, oy, 0xFFFFFFFF);
                  }

                  private boolean hov(int mx, int my, int x, int y, int w, int h) {
                      return mx >= x && mx < x + w && my >= y && my < y + h;
                  }

                  @Override
                  public void renderBackground(DrawContext context, int mouseX, int mouseY, float delta) {
                      // digambar manual di render()
                  }

                  @Override
                  public void render(DrawContext c, int mx, int my, float delta) {
                      Config cfg = Config.get();
                      GlassKit.box(c, 0, 0, this.width, this.height, 0xFF101010);
                      GlassKit.box(c, px, py, px + pw, py + ph, 0xFF1A1A1C);
                      GlassKit.box(c, px, py, px + pw, py + 22, 0xFF202023);
                      GlassKit.box(c, px + sideW, py + 22, px + sideW + 1, py + ph, 0xFF2E2E32);
                      GlassKit.box(c, rightX - 1, py + 22, rightX, py + ph, 0xFF2E2E32);
                      GlassKit.box(c, px, seekY - 8, px + pw, seekY - 7, 0xFF2E2E32);

                      if (seek != null) {
                          seek.sync();
                      }

                      super.render(c, mx, my, delta);

                      int bx = Math.max(4, px - 26);
                      btn(c, bx, py + 2, 20, 20, "<", hov(mx, my, bx, py + 2, 20, 20), false, false);
                      c.drawTextWithShadow(this.textRenderer, Text.literal("Music"), px + 8, py + 7, 0xFFFFFFFF);
                      btn(c, px + pw - 84, py + 3, 18, 16, "<", hov(mx, my, px + pw - 84, py + 3, 18, 16), false, false);
                      btn(c, px + pw - 22, py + 3, 18, 16, ">", hov(mx, my, px + pw - 22, py + 3, 18, 16), false, false);
                      int pages = pageCount();
                      c.drawCenteredTextWithShadow(this.textRenderer, Text.literal((pageIdx + 1) + "/" + pages),
                              px + pw - 57, py + 7, 0xFFAAAAAA);

                      btn(c, px + 2, py + 26, sideW - 4, 20, "Library", hov(mx, my, px + 2, py + 26, sideW - 4, 20), tab == 0, false);
                      btn(c, px + 2, py + 48, sideW - 4, 20, "Playlists", hov(mx, my, px + 2, py + 48, sideW - 4, 20), tab == 1, false);

                      // daftar
                      List<String> list = entries();
                      int per = rowsVisible();
                      int start = startY();
                      String cur = Music.current();
                      if (tab == 1 && openPl < 0) {
                          c.drawTextWithShadow(this.textRenderer, Text.literal("Klik playlist untuk membuka"), listX, listY - 10, 0xFF9A9AA0);
                      }
                      for (int i = 0; i < per; i++) {
                          int idx = pageIdx * per + i;
                          if (idx >= list.size()) {
                              break;
                          }
                          String name = list.get(idx);
                          int y = start + i * 22;
                          boolean isCur = tab == 0 ? name.equals(cur) : (tab == 1 && openPl < 0 ? false : name.equals(cur));
                          GlassKit.box(c, listX, y, listX + listW, y + 20, isCur ? 0xFF243A57 : 0xFF222226);
                          if (tab == 1 && openPl < 0) {
                              int n = cfg.playlists.get(idx).songs.size();
                              String shown = name.length() > 22 ? name.substring(0, 21) + "." : name;
                              c.drawTextWithShadow(this.textRenderer, Text.literal(shown), listX + 5, y + 6, 0xFFFFFFFF);
                              String cnt = n + " lagu";
                              c.drawTextWithShadow(this.textRenderer, Text.literal(cnt),
                                      listX + listW - this.textRenderer.getWidth(cnt) - 6, y + 6, 0xFF9A9AA0);
                          } else {
                              String shown = name.length() > 28 ? name.substring(0, 27) + "." : name;
                              c.drawTextWithShadow(this.textRenderer, Text.literal(shown), listX + 5, y + 6, 0xFFFFFFFF);
                              int ax = listX + listW - 22;
                              btn(c, ax, y, 20, 20, tab == 0 ? "+" : "X", hov(mx, my, ax, y, 20, 20), false, false);
                          }
                      }

                      if (tab == 1 && openPl >= 0) {
                          btn(c, listX + listW - 120, listY, 58, 20, "Simpan", hov(mx, my, listX + listW - 120, listY, 58, 20), false, true);
                          btn(c, listX + listW - 58, listY, 58, 20, "Hapus", hov(mx, my, listX + listW - 58, listY, 58, 20), false, false);
                      }

                      // panel kanan
                      c.drawTextWithShadow(this.textRenderer, Text.literal("Sedang diputar"), rightX + 10, py + 34, 0xFF9A9AA0);
                      String np = cur == null ? "-" : cur;
                      if (np.length() > 22) {
                          np = np.substring(0, 21) + ".";
                      }
                      c.drawTextWithShadow(this.textRenderer, Text.literal(np), rightX + 10, py + 46, 0xFFFFFFFF);
                      if (tab == 1) {
                          btn(c, rightX + 10, py + 92, rightW - 20, 20, "+ Playlist baru", hov(mx, my, rightX + 10, py + 92, rightW - 20, 20), false, true);
                      }

                      // seek bar labels
                      int total = Music.durationFrames();
                      c.drawTextWithShadow(this.textRenderer, Text.literal(Music.timeText(Music.positionFrames())),
                              seekX, seekY + 16, 0xFFAAAAAA);
                      String dur = Music.timeText(total);
                      c.drawTextWithShadow(this.textRenderer, Text.literal(dur),
                              seekX + seekW - this.textRenderer.getWidth(dur), seekY + 16, 0xFFAAAAAA);

                      // transport
                      int cx = px + pw / 2;
                      btn(c, cx - 96, transportY, 40, 20, "Acak", hov(mx, my, cx - 96, transportY, 40, 20), false, cfg.musicShuffle);
                      btn(c, cx - 50, transportY, 30, 20, "<<", hov(mx, my, cx - 50, transportY, 30, 20), false, false);
                      btn(c, cx - 16, transportY, 32, 20, "", hov(mx, my, cx - 16, transportY, 32, 20), false, true);
                      if (Music.isPlaying()) {
                          GlassKit.box(c, cx - 8, transportY + 6, cx - 5, transportY + 14, 0xFFFFFFFF);
                          GlassKit.box(c, cx + 1, transportY + 6, cx + 4, transportY + 14, 0xFFFFFFFF);
                      } else {
                          String[] tri = {"#...", "##..", "###.", "##..", "#..."};
                          int ox = cx - 6;
                          int oy = transportY + 6;
                          for (int r = 0; r < tri.length; r++) {
                              for (int k = 0; k < tri[r].length(); k++) {
                                  if (tri[r].charAt(k) == '#') {
                                      GlassKit.box(c, ox + k, oy + r, ox + k + 1, oy + r + 1, 0xFFFFFFFF);
                                  }
                              }
                          }
                      }
                      btn(c, cx + 20, transportY, 30, 20, ">>", hov(mx, my, cx + 20, transportY, 30, 20), false, false);
                      int rx = cx + 56;
                      boolean rHover = hov(mx, my, rx, transportY, 40, 20);
                      if (cfg.musicRepeat == 2) {
                          btn(c, rx, transportY, 40, 20, "", rHover, false, true);
                          repeatOneIcon(c, rx, transportY, 40, 20);
                      } else {
                          btn(c, rx, transportY, 40, 20, "R", rHover, false, cfg.musicRepeat == 1);
                      }

                      String line = Music.error.isEmpty() ? status : Music.error;
                      if (Music.error.isEmpty() && Music.current() != null) {
                          line = Music.debug();
                      }
                      if (list.isEmpty() && tab == 0) {
                          line = "Taruh file .mp3 di config/transparent-skin/music lalu buka lagi";
                      }
                      if (!line.isEmpty()) {
                          c.drawCenteredTextWithShadow(this.textRenderer, Text.literal(line), this.width / 2,
                                  Math.min(this.height - 10, py + ph + 6), 0xFFAAAAAA);
                      }
                  }

                  @Override
                  public boolean shouldPause() {
                      return false;
                  }

                  @Override
                  public void close() {
                      Config.save();
                      if (this.client != null) {
                          this.client.setScreen(this.parent);
                      }
                  }
              }

              // ------------------------------------------------------------------
              // Hitsound: suara saat memukul entity, dari config/transparent-skin/hitsounds
              // ------------------------------------------------------------------
              public static final class HitSound {
                  private static final Random RNG = new Random();
                  private static final Map<String, Music.Pcm> CACHE = new HashMap<>();
                  private static int src = -1;
                  private static int buf = -1;

                  private HitSound() {
                  }

                  public static Path dir() {
                      return FabricLoader.getInstance().getConfigDir().resolve("transparent-skin").resolve("hitsounds");
                  }

                  public static List<String> names() {
                      List<String> out = new ArrayList<>();
                      try {
                          Files.createDirectories(dir());
                          try (Stream<Path> st = Files.list(dir())) {
                              st.map(p -> p.getFileName().toString())
                                      .filter(n -> n.toLowerCase().endsWith(".mp3"))
                                      .sorted(String::compareToIgnoreCase)
                                      .forEach(out::add);
                          }
                      } catch (Throwable ignored) {
                      }
                      return out;
                  }

                  public static void play() {
                      try {
                          List<String> names = names();
                          if (names.isEmpty()) {
                              return;
                          }
                          String want = Config.get().hitSoundFile;
                          String pick = (want != null && names.contains(want)) ? want : names.get(RNG.nextInt(names.size()));
                          Music.Pcm pcm = CACHE.get(pick);
                          if (pcm == null) {
                              pcm = Music.decode(dir().resolve(pick));
                              CACHE.put(pick, pcm);
                          }
                          if (src < 0) {
                              src = AL10.alGenSources();
                              buf = AL10.alGenBuffers();
                              AL10.alSourcei(src, 0x202, 1);
                              AL10.alSource3f(src, AL10.AL_POSITION, 0f, 0f, 0f);
                          }
                          AL10.alSourceStop(src);
                          AL10.alSourcei(src, AL10.AL_BUFFER, 0);
                          AL10.alBufferData(buf, pcm.format(), pcm.data().duplicate(), pcm.rate());
                          AL10.alSourcei(src, AL10.AL_BUFFER, buf);
                          AL10.alSourcef(src, AL10.AL_GAIN, Config.get().hitSoundVolume / 100f);
                          AL10.alSourcePlay(src);
                      } catch (Throwable ignored) {
                      }
                  }
              }

              public static final class HitSoundScreen extends Screen {
                  private final Screen parent;
                  private int cardX;
                  private int cardY;
                  private int cardW;
                  private int cardH;

                  public HitSoundScreen(Screen parent) {
                      super(Text.literal("Hitsound"));
                      this.parent = parent;
                  }

                  private void btn(int x, int y, int w, int h, Runnable r) {
                      ButtonWidget b = ButtonWidget.builder(Text.empty(), btn -> r.run()).dimensions(x, y, w, h).build();
                      b.setAlpha(0f);
                      this.addDrawableChild(b);
                  }

                  private static String soundLabel(Config c) {
                      if (c.hitSoundFile == null || c.hitSoundFile.isEmpty()) {
                          return "Acak";
                      }
                      String n = c.hitSoundFile;
                      return n.length() > 14 ? n.substring(0, 13) + "." : n;
                  }

                  @Override
                  protected void init() {
                      Config c = Config.get();
                      cardW = Math.min(240, this.width - 24);
                      cardH = 170;
                      cardX = (this.width - cardW) / 2;
                      cardY = Math.max(30, (this.height - cardH) / 2 - 6);
                      int x = cardX + 8;
                      int w = cardW - 16;
                      int y = cardY + 34;
                      btn(x, y, w, 20, () -> {
                          c.hitSound = !c.hitSound;
                          Config.save();
                      });
                      this.addDrawableChild(new GlassSlider(x, y + 22, w, 20, "Volume suara", 0, 100, c.hitSoundVolume,
                              v -> c.hitSoundVolume = v));
                      btn(x, y + 44, w, 20, () -> {
                          List<String> opts = new ArrayList<>();
                          opts.add("");
                          opts.addAll(HitSound.names());
                          int i = opts.indexOf(c.hitSoundFile);
                          i = (i < 0 ? 0 : i + 1) % opts.size();
                          c.hitSoundFile = opts.get(i);
                          Config.save();
                      });
                      btn(x, y + 66, w, 20, HitSound::play);
                      btn(x, cardY + cardH - 28, w, 20, this::close);
                  }

                  @Override
                  public void renderBackground(DrawContext context, int mouseX, int mouseY, float delta) {
                  }

                  @Override
                  public void render(DrawContext c, int mx, int my, float delta) {
                      Config cfg = Config.get();
                      c.fill(0, 0, this.width, this.height, 0x66000000);
                      GlassKit.card(c, this.textRenderer, cardX, cardY, cardW, cardH, "Hitsound", GlassKit.BLUE);
                      int x = cardX + 8;
                      int w = cardW - 16;
                      int y = cardY + 34;
                      GlassKit.toggle(c, this.textRenderer, mx, my, x, y, w, 20, "Hitsound", cfg.hitSound);
                      GlassKit.action(c, this.textRenderer, mx, my, x, y + 44, w, 20, "Suara", soundLabel(cfg));
                      GlassKit.action(c, this.textRenderer, mx, my, x, y + 66, w, 20, "Tes suara", "");
                      GlassKit.row(c, this.textRenderer, x, cardY + cardH - 28, w, 20, "< Kembali", GlassKit.hov(mx, my, x, cardY + cardH - 28, w, 20));
                      if (HitSound.names().isEmpty()) {
                          c.drawCenteredTextWithShadow(this.textRenderer, Text.literal("Taruh .mp3 di config/transparent-skin/hitsounds"),
                                  this.width / 2, cardY + cardH + 8, 0xFFAAAAAA);
                      }
