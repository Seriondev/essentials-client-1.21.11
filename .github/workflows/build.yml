              public static final class AccountScreen extends Screen {
                  private static final int PER = 6;
                  private final Screen parent;
                  private TextFieldWidget field;
                  private String filter = "";
                  private String status = "";
                  private int accPage = 0;
                  private int cardX;
                  private int cardY;
                  private int cardW;
                  private int cardH;

                  public AccountScreen(Screen parent) {
                      super(Text.literal("Akun"));
                      this.parent = parent;
                  }

                  private void btn(int x, int y, int w, int h, Runnable r) {
                      ButtonWidget b = ButtonWidget.builder(Text.empty(), btn -> r.run()).dimensions(x, y, w, h).build();
                      b.setAlpha(0f);
                      this.addDrawableChild(b);
                  }

                  private List<String> filtered() {
                      String f = filter == null ? "" : filter.toLowerCase();
                      List<String> r = new ArrayList<>();
                      for (String a : Config.get().accounts) {
                          if (f.isEmpty() || a.toLowerCase().contains(f)) {
                              r.add(a);
                          }
                      }
                      return r;
                  }

                  @Override
                  protected void init() {
                      cardW = Math.min(260, this.width - 24);
                      cardH = 250;
                      cardX = (this.width - cardW) / 2;
                      cardY = Math.max(30, (this.height - cardH) / 2 - 6);
                      int x = cardX + 10;
                      int w = cardW - 20;

                      field = new TextFieldWidget(this.textRenderer, x, cardY + 34, w - 62, 20, Text.literal("Nama"));
                      field.setMaxLength(16);
                      field.setPlaceholder(Text.literal("Ketik nama"));
                      field.setText(filter);
                      field.setChangedListener(t -> {
                          filter = t;
                          accPage = 0;
                          this.clearAndInit();
                      });
                      this.addDrawableChild(field);
                      btn(x + w - 58, cardY + 34, 58, 20, this::addAccount);

                      List<String> list = filtered();
                      int pages = Math.max(1, (list.size() + PER - 1) / PER);
                      accPage = Math.max(0, Math.min(accPage, pages - 1));
                      for (int i = 0; i < PER; i++) {
                          int idx = accPage * PER + i;
                          if (idx >= list.size()) {
                              break;
                          }
                          String name = list.get(idx);
                          int y = cardY + 64 + i * 22;
                          btn(x, y, w - 26, 20, () -> select(name));
                          btn(x + w - 22, y, 22, 20, () -> delete(name));
                      }
                      int ny = cardY + cardH - 56;
                      btn(x, ny, 40, 20, () -> {
                          if (accPage > 0) {
                              accPage--;
                              this.clearAndInit();
                          }
                      });
                      btn(x + w - 40, ny, 40, 20, () -> {
                          if (accPage < pages - 1) {
                              accPage++;
                              this.clearAndInit();
                          }
                      });
                      btn(x, cardY + cardH - 28, w, 20, this::close);
                  }

                  private void addAccount() {
                      String n = field.getText().trim();
                      List<String> acc = Config.get().accounts;
                      if (!Accounts.valid(n)) {
                          status = "Nama: 1-16 karakter (huruf, angka, _)";
                          return;
                      }
                      if (acc.size() >= 500) {
                          status = "Maksimal 500 akun";
                          return;
                      }
                      for (String a : acc) {
                          if (a.equalsIgnoreCase(n)) {
                              status = "Akun sudah ada";
                              return;
                          }
                      }
                      acc.add(n);
                      Config.save();
                      status = "Ditambahkan: " + n;
                      filter = "";
                      this.clearAndInit();
                  }

                  private void delete(String name) {
                      Config.get().accounts.remove(name);
                      Config.save();
                      status = "Dihapus: " + name;
                      this.clearAndInit();
                  }

                  private void select(String name) {
                      try {
                          Accounts.switchTo(name);
                          this.close();
                      } catch (Throwable t) {
                          status = "Gagal: " + t.getMessage();
                      }
                  }

                  @Override
                  public void renderBackground(DrawContext context, int mouseX, int mouseY, float delta) {
                  }

                  @Override
                  public void render(DrawContext c, int mx, int my, float delta) {
                      c.fill(0, 0, this.width, this.height, 0x66000000);
                      GlassKit.card(c, this.textRenderer, cardX, cardY, cardW, cardH, "Akun", GlassKit.BLUE);
                      int x = cardX + 10;
                      int w = cardW - 20;
                      List<String> list = filtered();
                      int pages = Math.max(1, (list.size() + PER - 1) / PER);
                      String cur = Accounts.currentName();
                      for (int i = 0; i < PER; i++) {
                          int idx = accPage * PER + i;
                          if (idx >= list.size()) {
                              break;
                          }
                          String name = list.get(idx);
                          int y = cardY + 64 + i * 22;
                          boolean active = name.equals(cur);
                          GlassKit.box(c, x, y, x + w - 26, y + 20, active ? 0x553B82F6 : 0x22FFFFFF);
                          c.drawTextWithShadow(this.textRenderer, Text.literal((active ? "> " : "") + name), x + 6, y + 6, 0xFFFFFFFF);
                          GlassKit.box(c, x + w - 22, y, x + w, y + 20, 0x33FF5555);
                          c.drawCenteredTextWithShadow(this.textRenderer, Text.literal("X"), x + w - 11, y + 6, 0xFFFFFFFF);
                      }
                      int ny = cardY + cardH - 56;
                      c.drawTextWithShadow(this.textRenderer, Text.literal("Tambah"), x + w - 58 + 12, cardY + 40, 0x00FFFFFF);
                      GlassKit.box(c, x + w - 58, cardY + 34, x + w, cardY + 54, GlassKit.BLUE);
                      c.drawCenteredTextWithShadow(this.textRenderer, Text.literal("Tambah"), x + w - 29, cardY + 40, 0xFFFFFFFF);
                      GlassKit.box(c, x, ny, x + 40, ny + 20, 0x33FFFFFF);
                      c.drawCenteredTextWithShadow(this.textRenderer, Text.literal("<"), x + 20, ny + 6, 0xFFFFFFFF);
                      GlassKit.box(c, x + w - 40, ny, x + w, ny + 20, 0x33FFFFFF);
                      c.drawCenteredTextWithShadow(this.textRenderer, Text.literal(">"), x + w - 20, ny + 6, 0xFFFFFFFF);
                      c.drawCenteredTextWithShadow(this.textRenderer,
                              Text.literal((accPage + 1) + "/" + pages + "  |  " + Config.get().accounts.size() + "/500"),
                              x + w / 2, ny + 6, 0xFFBFC5CE);
                      c.drawCenteredTextWithShadow(this.textRenderer, Text.literal(status), this.width / 2, cardY + cardH + 8, 0xFFAAAAAA);
                      GlassKit.row(c, this.textRenderer, x, cardY + cardH - 28, w, 20, "< Kembali",
                              GlassKit.hov(mx, my, x, cardY + cardH - 28, w, 20));
                      super.render(c, mx, my, delta);
                  }

                  @Override
                  public boolean shouldPause() {
                      return false;
                  }

                  @Override
                  public void close() {
                      if (this.client != null) {
                          this.client.setScreen(this.parent);
                      }
                  }
              }

              // ------------------------------------------------------------------
              // Slider opacity (0 - 100 %)
              // ------------------------------------------------------------------
              private static final class OpacitySlider extends SliderWidget {
                  private final String label;
                  private final IntConsumer setter;

                  OpacitySlider(int x, int y, int width, int height, String label, int percent, IntConsumer setter) {
                      super(x, y, width, height, Text.empty(), percent / 100.0);
                      this.label = label;
                      this.setter = setter;
                      this.updateMessage();
                  }

                  @Override
                  protected void updateMessage() {
                      String l = this.label == null ? "" : this.label;
                      this.setMessage(Text.literal(l + ": " + (int) Math.round(this.value * 100.0) + "%"));
                  }

                  @Override
                  protected void applyValue() {
                      if (this.setter != null) {
                          this.setter.accept((int) Math.round(this.value * 100.0));
                      }
                  }
              }
          }
